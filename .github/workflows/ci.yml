name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cortinas
          POSTGRES_PASSWORD: cortinas
          POSTGRES_DB: cortinas_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cortinas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://cortinas:cortinas@localhost:5432/cortinas_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w web
