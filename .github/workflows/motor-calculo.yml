name: motor-calculo
on:
  push:
    paths: ['motor-calculo/**', '.github/workflows/motor-calculo.yml']
  pull_request:
    paths: ['motor-calculo/**', '.github/workflows/motor-calculo.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor-calculo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motor-calculo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
